# Conductor — Development Docker Compose
# Apple Silicon ready · Airflow 3.3.0 · dbt-core 2.0.0a4
#
# FIRST TIME:  docker compose --profile init up airflow-db-init && docker compose up -d
# SUBSEQUENT:  docker compose up -d
#
# Secrets are read from .env at project root (gitignored).
# See .env.example for all available variables.

# ── Canonical project-runtime image ──
# Build and tag exactly the image consumed by rendered per-project Compose.
x-airflow-runtime-image: &airflow-runtime-image
  build:
    context: ./docker/airflow
    args:
      AIRFLOW_VERSION: 3.3.0
  image: conductor-airflow:latest

services:

  # ─── Database ───
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${CONDUCTOR_DB_USER:-conductor}
      POSTGRES_PASSWORD: ${CONDUCTOR_DB_PASSWORD:-conductor}
      POSTGRES_DB: ${CONDUCTOR_DB_NAME:-conductor}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONDUCTOR_DB_USER:-conductor}"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    restart: unless-stopped

  # ─── Cache / Message Broker ───
  redis:
    image: redis:8.6.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Conductor Backend ───
  fastapi:
    build: ./backend
    image: conductor-backend:latest
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      CONDUCTOR_DATABASE_URL: >-
        postgresql+asyncpg://${CONDUCTOR_DB_USER:-conductor}:${CONDUCTOR_DB_PASSWORD:-conductor}@${CONDUCTOR_DB_HOST:-postgres}:${CONDUCTOR_DB_PORT:-5432}/${CONDUCTOR_DB_NAME:-conductor}
      CONDUCTOR_REDIS_URL: >-
        redis://${CONDUCTOR_REDIS_HOST:-redis}:${CONDUCTOR_REDIS_PORT:-6379}/1
      CONDUCTOR_SECRET_KEY: ${CONDUCTOR_JWT_SECRET:-conductor-dev-jwt-secret-change-in-prod}
      CONDUCTOR_CREDENTIALS_ENCRYPTION_KEY: ${CONDUCTOR_CREDENTIALS_ENCRYPTION_KEY:?Set CONDUCTOR_CREDENTIALS_ENCRYPTION_KEY to a stable Fernet key}
      CONDUCTOR_TRUSTED_PROXY_CIDRS: "${CONDUCTOR_TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128}"
      # The Settings default remains Secure for production HTTPS. This explicit
      # localhost-only Compose override permits browser proxy cookies on HTTP.
      CONDUCTOR_AIRFLOW_PROXY_COOKIE_SECURE: "false"
      CONDUCTOR_CODE_SERVER_HOST: http://code-server:8080
      CONDUCTOR_CODE_SERVER_JWT_SECRET: ${CONDUCTOR_CODE_SERVER_JWT_SECRET:-conductor-cs-jwt-secret}
    ports:
      - "8000:8000"
    networks:
      default: {}
      frontend_backend:
        aliases:
          - fastapi-proxy-target
      runtime_ingress: {}
    volumes:
      - ./backend/app:/app/app  # hot-reload
      - ./backend/tests:/app/tests  # test files
      - ./backend/pyproject.toml:/app/pyproject.toml  # for pytest config
      - ./workspaces:/workspace  # shared with code-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The sole component that can create or inspect project Docker resources.
  lifecycle-worker:
    build: ./backend
    image: conductor-backend:latest
    env_file:
      - path: ./backend/.env
        required: false
    command: python -m app.workers.lifecycle
    environment:
      CONDUCTOR_DATABASE_URL: >-
        postgresql+asyncpg://${CONDUCTOR_DB_USER:-conductor}:${CONDUCTOR_DB_PASSWORD:-conductor}@${CONDUCTOR_DB_HOST:-postgres}:${CONDUCTOR_DB_PORT:-5432}/${CONDUCTOR_DB_NAME:-conductor}
      CONDUCTOR_CREDENTIALS_ENCRYPTION_KEY: ${CONDUCTOR_CREDENTIALS_ENCRYPTION_KEY:?Set CONDUCTOR_CREDENTIALS_ENCRYPTION_KEY to a stable Fernet key}
      CONDUCTOR_LIFECYCLE_RUNTIME_ROOT: /var/lib/conductor/runtimes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtime:/var/lib/conductor/runtimes
    networks:
      default: {}
      runtime_ingress: {}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Conductor Frontend (placeholder — TBD) ───
  # react-ui:
  #   build: ./frontend
  #   ports:
  #     - "3000:80"
  #   depends_on: [fastapi]

  # Build-only target. It is explicitly profiled out of `docker compose up`;
  # project runtimes are created solely by lifecycle-worker from the template.
  project-airflow-runtime-image:
    <<: *airflow-runtime-image
    profiles:
      - airflow-image-build

  # ─── code-server (multiuser, JWT auth) ───
  code-server:
    build: ./docker/code-server
    image: conductor-code-server:latest
    profiles:
      - mvp-04-ide
    environment:
      CODE_SERVER_AUTH: jwt
      CODE_SERVER_JWT_SECRET: ${CONDUCTOR_CODE_SERVER_JWT_SECRET:-conductor-cs-jwt-secret}
      PASSWORD: ""
      DEFAULT_WORKSPACE: /workspace
    ports:
      - "8443:8080"
    volumes:
      - ./workspaces:/workspace
      - ./dags:/workspace/dags:ro
    restart: unless-stopped

  # ─── Frontend (React SPA) ───
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    networks:
      frontend_backend: {}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - fastapi
    restart: unless-stopped

networks:
  frontend_backend:
    driver: bridge
  runtime_ingress:
    name: conductor-runtime-ingress

volumes:
  postgres_data:
  frontend_node_modules: