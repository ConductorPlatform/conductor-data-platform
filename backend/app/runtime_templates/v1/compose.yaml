name: ${COMPOSE_PROJECT_NAME}

x-airflow-environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: >-
      [{"name":"conductor-git","classpath":"conductor_git_bundle.ConductorGitDagBundle","kwargs":{"git_conn_id":"conductor_git","refresh_interval":60}}]
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_ROLE}:${AIRFLOW_DB_PASSWORD_URLENCODED}@${AIRFLOW_DATABASE_HOST}:${AIRFLOW_DATABASE_PORT}/${AIRFLOW_DB_NAME}
    AIRFLOW__CELERY__BROKER_URL: redis://project-redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_ROLE}:${AIRFLOW_DB_PASSWORD_URLENCODED}@${AIRFLOW_DATABASE_HOST}:${AIRFLOW_DATABASE_PORT}/${AIRFLOW_DB_NAME}
    AIRFLOW__API__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080
    # Private generated values consumed by the approved dbt-postgres workflow.
    CONDUCTOR_WAREHOUSE_HOST: ${WAREHOUSE_HOST}
    CONDUCTOR_WAREHOUSE_PORT: ${WAREHOUSE_PORT}
    CONDUCTOR_WAREHOUSE_DATABASE: ${WAREHOUSE_DB_NAME}
    CONDUCTOR_WAREHOUSE_ROLE: ${WAREHOUSE_DB_ROLE}
    CONDUCTOR_WAREHOUSE_PASSWORD_URLENCODED: ${WAREHOUSE_DB_PASSWORD_URLENCODED}
    CONDUCTOR_WAREHOUSE_SCHEMA: ${WAREHOUSE_SCHEMA}
    CONDUCTOR_PROJECT_ID: ${CONDUCTOR_PROJECT_ID}
    CONDUCTOR_RUNTIME_SUBPATH: ${CONDUCTOR_RUNTIME_SUBPATH}

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE:-conductor-airflow:latest}
  environment: *airflow-environment
  volumes:
    - dags:/opt/airflow/dags
    - logs:/opt/airflow/logs
    - type: volume
      source: conductor-runtime-secrets
      target: /run/secrets
      read_only: true
      volume:
        subpath: ${CONDUCTOR_RUNTIME_SUBPATH}
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    project-redis:
      condition: service_healthy
  labels:
    - conductor.managed=true
    - conductor.project_id=${CONDUCTOR_PROJECT_ID}
    - conductor.template_version=${CONDUCTOR_TEMPLATE_VERSION}
    - traefik.enable=false

services:
  project-redis:
    image: redis:8.6.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    labels:
      - conductor.managed=true
      - conductor.project_id=${CONDUCTOR_PROJECT_ID}
      - conductor.template_version=${CONDUCTOR_TEMPLATE_VERSION}
      - traefik.enable=false

  airflow-init:
    <<: *airflow-common
    restart: "no"
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_DEV_USER: ${AIRFLOW_DEV_USER}
      AIRFLOW_DEV_PASSWORD: ${AIRFLOW_DEV_PASSWORD}
      AIRFLOW_VIEWER_USER: ${AIRFLOW_VIEWER_USER}
      AIRFLOW_VIEWER_PASSWORD: ${AIRFLOW_VIEWER_PASSWORD}
      AIRFLOW_INTEGRATION_USER: ${AIRFLOW_INTEGRATION_USER}
      AIRFLOW_INTEGRATION_PASSWORD: ${AIRFLOW_INTEGRATION_PASSWORD}
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        python /home/airflow/bootstrap_airflow_users.py

  airflow-api-server:
    <<: *airflow-common
    command: airflow api-server --apps all
    volumes:
      - dags:/opt/airflow/dags
      - logs:/opt/airflow/logs
      - type: volume
        source: conductor-runtime-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: ${CONDUCTOR_RUNTIME_SUBPATH}
      - type: volume
        source: conductor-dbt-artifacts
        target: /opt/airflow/conductor-dbt-artifacts
        read_only: true
        volume:
          subpath: ${CONDUCTOR_RUNTIME_SUBPATH}
    networks:
      default: {}
      ingress:
        aliases:
          - ${AIRFLOW_INTERNAL_ALIAS}
    labels:
      - conductor.managed=true
      - conductor.project_id=${CONDUCTOR_PROJECT_ID}
      - conductor.template_version=${CONDUCTOR_TEMPLATE_VERSION}
      - traefik.enable=false

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler

  airflow-dag-processor:
    <<: *airflow-common
    command: airflow dag-processor
    volumes:
      - dags:/opt/airflow/dags
      - logs:/opt/airflow/logs
      - type: volume
        source: conductor-runtime-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: ${CONDUCTOR_RUNTIME_SUBPATH}
      - type: volume
        source: conductor-dbt-artifacts
        target: /opt/airflow/conductor-dbt-artifacts
        read_only: true
        volume:
          subpath: ${CONDUCTOR_RUNTIME_SUBPATH}

  airflow-worker:
    <<: *airflow-common
    command: airflow celery worker
    volumes:
      - dags:/opt/airflow/dags
      - logs:/opt/airflow/logs
      - type: volume
        source: conductor-runtime-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: ${CONDUCTOR_RUNTIME_SUBPATH}
      - type: volume
        source: conductor-dbt-artifacts
        target: /opt/airflow/conductor-dbt-artifacts
        volume:
          subpath: ${CONDUCTOR_RUNTIME_SUBPATH}

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}_default
    labels:
      conductor.managed: "true"
      conductor.project_id: ${CONDUCTOR_PROJECT_ID}
      conductor.template_version: ${CONDUCTOR_TEMPLATE_VERSION}
  ingress:
    name: ${CONDUCTOR_RUNTIME_INGRESS_NETWORK}
    external: true

volumes:
  dags:
    labels:
      conductor.managed: "true"
      conductor.project_id: ${CONDUCTOR_PROJECT_ID}
      conductor.template_version: ${CONDUCTOR_TEMPLATE_VERSION}
  logs:
    labels:
      conductor.managed: "true"
      conductor.project_id: ${CONDUCTOR_PROJECT_ID}
      conductor.template_version: ${CONDUCTOR_TEMPLATE_VERSION}
  conductor-runtime-secrets:
    name: conductor-runtime-secrets
    external: true
  conductor-dbt-artifacts:
    name: conductor-dbt-artifacts
    external: true
